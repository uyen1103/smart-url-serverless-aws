AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lop bien cho Smart URL Shortener: CloudFront + AWS WAF + S3 (giao dien).
  Phai deploy o us-east-1 (WAF pham vi CLOUDFRONT va chung chi ACM cho CloudFront chi o do). Co phi WAF.

  Dinh tuyen:  /api/* va /{code}  -> API Gateway (khong cache, vi phai dem tung click)
               /assets|vendor|css|js|mock/*, moi duong dan co dau cham (*.html, *.ico...)  -> S3 (giao dien)
               /  -> 302 sang /index.html
  Khop voi validation.RESERVED_ALIASES o backend: ma rut gon khong chua dau cham va khong trung ten thu muc tren.

Parameters:
  ApiDomain:
    Type: String
    Description: Output ApiDomain cua stack backend, dang abc123.execute-api.ap-southeast-2.amazonaws.com
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: >
      Bi mat dung chung voi backend (CloudFront gan vao header X-Origin-Verify). Gia tri phai trung voi SSM
      SecureString ma tham so OriginVerifySecretParam cua backend tro toi. Sinh bang `openssl rand -hex 24`
  DomainName:
    Type: String
    Default: ''
    Description: Ten mien rieng (vi du linkpulse.vn). De trong = dung domain *.cloudfront.net
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN chung chi ACM o us-east-1 cho DomainName. Can khi dat DomainName
  RateLimitPer5Min:
    Type: Number
    Default: 1000
    MinValue: 10
    Description: So request toi da moi IP trong 5 phut tren toan domain (mang dung chung IP co the bi chan nham neu dat thap)
  ShortenRateLimitPer5Min:
    Type: Number
    Default: 50
    MinValue: 10
    Description: So request POST /api/shorten toi da moi IP trong 5 phut
  EnableWaf:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Bat AWS WAF (Web ACL pham vi CLOUDFRONT). Mac dinh tat vi WAF co phi; chi bat khi kiem thu
      (1-2 gio), chup bang chung roi tat lai. Can deploy stack edge o us-east-1.
  WafLogBucket:
    Type: String
    Default: ''
    Description: >
      Ten bucket S3 nhan log WAF (chi dung khi EnableWaf=true). De trong = khong ghi log WAF.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  WafEnabled: !Equals [!Ref EnableWaf, 'true']
  WafLoggingEnabled: !And
    - !Equals [!Ref EnableWaf, 'true']
    - !Not [!Equals [!Ref WafLogBucket, '']]

Resources:
  # ------------------------------------------------------------------ Giao dien (S3, rieng tu, chi CloudFront doc)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------------ Chinh sach CloudFront
  # Chuyen tiep header backend can, KHONG chuyen Host (API Gateway tu choi Host la)
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api-origin-request"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Address
            - User-Agent
            - Referer
            - Accept
            - X-Owner-Id
        CookiesConfig: {CookieBehavior: none}
        QueryStringsConfig: {QueryStringBehavior: all}

  # Tep tinh cache ngan (5 phut) de deploy giao dien moi co hieu luc nhanh
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static"
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}

  # Truy cap "/" -> 302 sang /index.html, chay ngay tai bien (khong ton luot goi Lambda)
  RootRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-root-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect / to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/') {
            return {statusCode: 302, statusDescription: 'Found',
                    headers: {location: {value: '/index.html'}}};
          }
          return request;
        }

  # ------------------------------------------------------------------ WAF
  # Chi tao khi EnableWaf=true. Web ACL pham vi CLOUDFRONT chi tao duoc o us-east-1.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabled
    Properties:
      Name: !Sub "${AWS::StackName}-acl"
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${AWS::StackName}-acl"}
      Rules:
        - Name: ShortenRateLimit
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref ShortenRateLimitPer5Min
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /api/shorten
                  FieldToMatch: {UriPath: {}}
                  PositionalConstraint: STARTS_WITH
                  TextTransformations: [{Priority: 0, Type: NONE}]
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ShortenRateLimit}
        - Name: GlobalRateLimit
          Priority: 1
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Min
              AggregateKeyType: IP
              EvaluationWindowSec: 300
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: GlobalRateLimit}
        - Name: AmazonIpReputation
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: AmazonIpReputation}
        - Name: CommonRuleSet
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: CommonRuleSet}

  # Ghi log WAF vao bucket S3 co san (chi khi bat WAF va co truyen WafLogBucket).
  # Bucket ngoai can policy cho phep delivery.logs.amazonaws.com ghi vao prefix AWSLogs/<account-id>/*.
  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Condition: WafLoggingEnabled
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs: [!Sub "arn:aws:s3:::${WafLogBucket}"]

  # ------------------------------------------------------------------ CloudFront
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        WebACLId: !If [WafEnabled, !GetAtt WebAcl.Arn, !Ref AWS::NoValue]
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: api
            DomainName: !Ref ApiDomain
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            # Backend chi nhan request co header nay (src/linkpulse/origin.py): khong goi thang API de ne WAF duoc
            OriginCustomHeaders:
              - {HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret}
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        # Mac dinh: /{code} (redirect) va moi thu khac -> API
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt RootRedirectFunction.FunctionMetadata.FunctionARN}
        # Thu tu co y nghia: /api/* dung truoc de /api/x.y khong bi bat boi mau /*.* cua giao dien
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /assets/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /vendor/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /css/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /js/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /mock/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /*.*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true

Outputs:
  DistributionDomain:
    Description: Domain CloudFront; neu dung DomainName thi tao ban ghi CNAME/ALIAS tro ve day
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: ID cua distribution (dung de tao invalidation khi doi giao dien)
    Value: !Ref Distribution
  FrontendBucketName:
    Description: Bucket chua giao dien cua TV2 (aws s3 sync <thu muc giao dien> s3://<bucket>)
    Value: !Ref FrontendBucket
  WebAclArn:
    Condition: WafEnabled
    Description: ARN cua Web ACL (chi xuat khi EnableWaf=true)
    Value: !GetAtt WebAcl.Arn
