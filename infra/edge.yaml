AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lớp biên cho Smart URL Shortener: CloudFront + AWS WAF + S3 (giao diện).
  Phải deploy ở us-east-1 (WAF phạm vi CLOUDFRONT và chứng chỉ ACM cho CloudFront chỉ ở đó). Có phí WAF.

  Định tuyến:  /api/* và /{code}  -> API Gateway (không cache, vì phải đếm từng click)
               /assets|vendor|css|js|mock/*, mọi đường dẫn có dấu chấm (*.html, *.ico...)  -> S3 (giao diện)
               /  -> 302 sang /index.html
  Khớp với validation.RESERVED_ALIASES ở backend: mã rút gọn không chứa dấu chấm và không trùng tên thư mục trên.

Parameters:
  ApiDomain:
    Type: String
    Description: Output ApiDomain của stack backend, dạng abc123.execute-api.ap-southeast-1.amazonaws.com
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: >
      Bí mật dùng chung với backend (CloudFront gắn vào header X-Origin-Verify). Giá trị phải trùng với SSM
      SecureString mà tham số OriginVerifySecretParam của backend trỏ tới. Sinh bằng `openssl rand -hex 24`
  DomainName:
    Type: String
    Default: ''
    Description: Tên miền riêng (ví dụ linkpulse.vn). Để trống = dùng domain *.cloudfront.net
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN chứng chỉ ACM ở us-east-1 cho DomainName. Cần khi đặt DomainName
  RateLimitPer5Min:
    Type: Number
    Default: 1000
    MinValue: 10
    Description: Số request tối đa mỗi IP trong 5 phút trên toàn domain (mạng dùng chung IP có thể bị chặn nhầm nếu đặt thấp)
  ShortenRateLimitPer5Min:
    Type: Number
    Default: 50
    MinValue: 10
    Description: Số request POST /api/shorten tối đa mỗi IP trong 5 phút

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # ------------------------------------------------------------------ Giao diện (S3, riêng tư, chỉ CloudFront đọc)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------------ Chính sách CloudFront
  # Chuyển tiếp header backend cần, KHÔNG chuyển Host (API Gateway từ chối Host lạ)
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api-origin-request"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Viewer-Address
            - User-Agent
            - Referer
            - Accept
            - X-Owner-Id
        CookiesConfig: {CookieBehavior: none}
        QueryStringsConfig: {QueryStringBehavior: all}

  # Tệp tĩnh cache ngắn (5 phút) để deploy giao diện mới có hiệu lực nhanh
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static"
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}

  # Truy cập "/" -> 302 sang /index.html, chạy ngay tại biên (không tốn lượt gọi Lambda)
  RootRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-root-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect / to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/') {
            return {statusCode: 302, statusDescription: 'Found',
                    headers: {location: {value: '/index.html'}}};
          }
          return request;
        }

  # ------------------------------------------------------------------ WAF
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-acl"
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${AWS::StackName}-acl"}
      Rules:
        - Name: ShortenRateLimit
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref ShortenRateLimitPer5Min
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /api/shorten
                  FieldToMatch: {UriPath: {}}
                  PositionalConstraint: STARTS_WITH
                  TextTransformations: [{Priority: 0, Type: NONE}]
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ShortenRateLimit}
        - Name: GlobalRateLimit
          Priority: 1
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Min
              AggregateKeyType: IP
              EvaluationWindowSec: 300
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: GlobalRateLimit}
        - Name: AmazonIpReputation
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: AmazonIpReputation}
        - Name: CommonRuleSet
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: CommonRuleSet}

  # ------------------------------------------------------------------ CloudFront
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        WebACLId: !GetAtt WebAcl.Arn
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: api
            DomainName: !Ref ApiDomain
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            # Backend chỉ nhận request có header này (src/linkpulse/origin.py): không gọi thẳng API để né WAF được
            OriginCustomHeaders:
              - {HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret}
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        # Mặc định: /{code} (redirect) và mọi thứ khác -> API
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt RootRedirectFunction.FunctionMetadata.FunctionARN}
        # Thứ tự có ý nghĩa: /api/* đứng trước để /api/x.y không bị bắt bởi mẫu /*.* của giao diện
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /assets/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /vendor/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /css/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /js/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /mock/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /*.*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true

Outputs:
  DistributionDomain:
    Description: Domain CloudFront; nếu dùng DomainName thì tạo bản ghi CNAME/ALIAS trỏ về đây
    Value: !GetAtt Distribution.DomainName
  FrontendBucketName:
    Description: Bucket chứa giao diện của TV2 (aws s3 sync <thư mục giao diện> s3://<bucket>)
    Value: !Ref FrontendBucket
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
