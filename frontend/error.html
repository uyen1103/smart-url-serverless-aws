<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Liên kết không khả dụng — LinkPulse.">
  <title>Liên kết không khả dụng — LinkPulse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
  <!-- error.js chỉ hiển thị các loại lỗi được hỗ trợ trong danh sách trạng thái. -->
  <script type="module" src="/js/error.js"></script>
</head>
<body>
  <header class="site-header" data-site-header></header>
  <main id="main" class="state-page">
    <section class="surface state-card" aria-labelledby="error-title">
      <div class="state-icon error" aria-hidden="true">×</div>
      <p class="eyebrow">Liên kết không khả dụng</p>
      <h1 id="error-title">Không tìm thấy liên kết</h1>
      <p id="error-message"></p>
      <p id="error-code" class="mono muted"></p>
      <div id="error-actions" class="state-actions"></div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <div class="toast-region" data-toast-region aria-live="polite" aria-atomic="true"></div>
</body>
</html>
