AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart URL Shortener - khung backend (hello-world), tuần 1

Globals:
  Function:
    Runtime: python3.11
    Timeout: 5          # giây
    MemorySize: 128     # MB

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello/
      Handler: app.lambda_handler
      Events:
        HelloApi:
          Type: HttpApi        # HTTP API (rẻ hơn REST API)
          Properties:
            Path: /hello
            Method: GET

Outputs:
  HelloApiUrl:
    Description: URL để thử hello-world
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
